model = "gpt-5.4-mini"
model_reasoning_effort = "medium"
model_reasoning_summary = "auto"

approval_policy = "never"
sandbox_mode = "workspace-write"

web_search = "disabled"
project_doc_max_bytes = 24576
allow_login_shell = false

log_dir = "/home/_404/.local/state/codex/log" 
sqlite_home = "/home/_404/.local/state/codex/sqlite"

[features]
hooks = false
shell_tool = true
shell_snapshot = false

[history]
persistence = "none"

[sandbox_workspace_write]
network_access = false
writable_roots = [
  "/home/_404/src",
  "/home/_404/.local/share/codex",
  "/home/_404/.local/share/chezmoi",
]

[shell_environment_policy]
inherit = "core"
include_only = [
  "HOME",
  "PATH",
  "SHELL",
  "TERM",
  "USER",
  "LOGNAME",
  "PWD",
  "LANG",
  "LC_*",

  "XDG_CONFIG_HOME",
  "XDG_DATA_HOME",
  "XDG_STATE_HOME",
  "XDG_CACHE_HOME",

  "CODEX_HOME",
  "CODEX_STATE",
  "CODEX_CACHE",
  "CODEX_BIN",
  "CODEX_SQLITE_HOME",
]
exclude = [
  "*TOKEN*",
  "*SECRET*",
  "*KEY*",
  "*PASSWORD*",
]

PATH = "/home/_404/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/bin"

[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "model",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "context-window-size",
  "used-tokens",
  "total-input-tokens",
  "total-output-tokens",
]

[tui.model_availability_nux]
"gpt-5.5" = 4

[projects."/home/_404/src"]
trust_level = "trusted"

[projects."/home/_404/src/fatb4f"]
trust_level = "trusted"

[projects."/home/_404/src/fatb4f/frame"]
trust_level = "trusted"

[projects."/home/_404/src/fatb4f/bashly.sh"]
trust_level = "trusted"

[projects."/home/_404/.local/share/chezmoi"]
trust_level = "trusted"

[projects."/home/_404/.local/share/codex"]
trust_level = "trusted"

[projects."/home/_404/.local/share/chezmoi/dot_local/share/codex/skills/neovim-config"]
trust_level = "trusted"

[projects."/home/_404/src/patchplan-probe"]
trust_level = "trusted"

[projects."/home/_404/src/dotfiles"]
trust_level = "trusted"

[mcp_servers.git]
command = "/home/_404/.local/bin/git-mcp-go" 
args = [
  "serve",
  "-r", "/home/_404/.local/share/chezmoi",
  "--mode", "shell"
]
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 60

enabled_tools = [
  "git_list_repositories",
  "git_status",
  "git_diff_unstaged",
  "git_diff_staged",
  "git_diff",
  "git_log",
  "git_show",
  "git_add",
  "git_reset",
  "git_commit"
]

default_tools_approval_mode = "prompt"

[mcp_servers.git-mcp-server]
command = "/home/_404/.local/bin/git-mcp-go"
args = ["serve", "--mode", "shell", "-r=/home/_404/src/dotfiles,/home/_404/src/main-track"]
env_vars = ["PATH", "CODEX_HOME", "CODEX_STATE"]

[mcp_servers.git-mcp-server.tools.git_status]
approval_mode = "approve"

[mcp_servers.git-mcp-server.tools.git_commit]
approval_mode = "approve"

[mcp_servers.git-mcp-server.tools.git_add]
approval_mode = "approve"

[mcp_servers.git-mcp-server.tools.git_diff_staged]
approval_mode = "approve"

[mcp_servers.git-mcp-server.tools.git_diff]
approval_mode = "approve"

[mcp_servers.git-mcp-server.tools.git_diff_unstaged]
approval_mode = "approve"

[mcp_servers.git-mcp-server.tools.git_list_repositories]
approval_mode = "approve"

[mcp_servers.git-mcp-server.tools.git_reset]
approval_mode = "approve"

[mcp_servers.git-mcp-server.tools.git_log]
approval_mode = "approve"

[mcp_servers.git-mcp-server.tools.git_show]
approval_mode = "approve"

[plugins."github@openai-curated"]
enabled = true

[apps.connector_6977da51d0188191859f0037971156d9.tools.github-mcp_get_label]
approval_mode = "approve"

