general {
    # logind Lock event -> actual lock actuator
    lock_cmd = ~/.local/bin/session lock

    # Unlock cleanup is owned by the installed session post-unlock hook.
    on_unlock_cmd = /usr/local/libexec/session-post-unlock

    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on

    inhibit_sleep = 3
}

# No idle-to-lock listener during active Pomodoro.
# Pomodoro owns lock cadence.

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
