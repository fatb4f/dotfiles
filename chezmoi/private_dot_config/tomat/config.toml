[timer]
work = 25.0
break = 5.0
long_break = 15.0
sessions = 4

# Required for break-lock:
# Work automatically transitions into break, so the break_start hook fires.
# Returning to work is resumed from the unlock edge after break_end marks it.
auto_advance = "to-break"

[sound]
enabled = false
system_beep = false
use_embedded = false
volume = 0.5

[notification]
enabled = true
icon = "/usr/share/icons/Adwaita/symbolic/status/alarm-symbolic.svg"
timeout = 5000
urgency = "normal"

[display]
text_format = "{icon} {time} {phase} {state}"
text_format_idle = ""

[hooks.on_break_start]
cmd = "/usr/local/libexec/tomat-break-begin"
timeout = 5
capture_output = true

[hooks.on_long_break_start]
cmd = "/usr/local/libexec/tomat-break-begin"
timeout = 5
capture_output = true

[hooks.on_break_end]
cmd = "/usr/local/libexec/tomat-break-end"
timeout = 5
capture_output = true

[hooks.on_long_break_end]
cmd = "/usr/local/libexec/tomat-break-end"
timeout = 5
capture_output = true
