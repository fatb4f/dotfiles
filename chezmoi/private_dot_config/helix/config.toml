# tab = "move_parent_node_end"  # optional example
# S-tab = "move_parent_node_start"  # optional example

# [keys.insert]
# S-tab = "move_parent_node_start"  # optional example

# -----------------------------------------------------------------------------
# Not part of config.toml
# -----------------------------------------------------------------------------
# Language definitions, language servers, formatters, grammar sources, and
# language-level overrides belong in languages.toml, not config.toml.
#
# languages.toml-only families documented in languages.md include:
#   use-grammars
#   [[language]]
#   [language-server.<name>]
#   [[grammar]]
#
# Picker, prompt, completion-menu, popup, and signature-help popup key tables
# are documented in keymap.md as not remappable, so they are intentionally not
# projected into [keys.*] config here.
