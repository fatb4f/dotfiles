# Helix config.toml — normalized commented reference
#
# Entire file is inert: every TOML assignment and table header is commented out.
# Uncomment only the sections/keys you want to override.
#
# Sources supplied:
#   - editor.md   -> editor configuration
#   - keymap.md   -> default remappable normal/insert/minor-mode bindings
#   - themes.md   -> theme selection syntax
#   - languages.md -> language/LSP settings (kept out of config.toml except the
#                     project-level workspace-lsp-roots crossover)
#
# Key notation below is normalized to Helix remapping syntax:
#   Ctrl- => C-, Alt- => A-, Shift- => S-
#   Enter => ret, Escape => esc, PageUp => pageup, PageDown => pagedown, etc.

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
# Choose EITHER a single theme:
# theme = "default"  # example built-in theme name
#
# OR adaptive dark/light themes:
# [theme]
# dark = "catppuccin_frappe"
# light = "catppuccin_latte"
# fallback = "catppuccin_frappe"  # optional; defaults to dark theme

# -----------------------------------------------------------------------------
# Editor — top-level
# -----------------------------------------------------------------------------
# [editor]
# scrolloff = 5  # default; lines of viewport padding
# mouse = true  # default
# mouse-yank-register = "*"  # default
# middle-click-paste = true  # default
# default-yank-register = '"'  # default register is the double-quote register
# scroll-lines = 3  # default
# shell = ["sh", "-c"]  # Unix default; Windows uses ["cmd", "/C"]
# line-number = "absolute"  # default; alternative: "relative"
# cursorline = false  # default
# cursorcolumn = false  # default
# continue-comments = true  # default
# gutters = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]  # default
# auto-completion = true  # default
# path-completion = true  # default
# auto-format = true  # default; language must generally allow auto-format too
# idle-timeout = 250  # default ms
# completion-timeout = 250  # default ms; 5 gives near-instant completion
# preview-completion-insert = true  # default
# completion-trigger-len = 2  # default
# completion-replace = false  # default
# auto-info = true  # default
# true-color = false  # default
# undercurl = false  # default
# rulers = []  # default
# bufferline = "never"  # default; "always" | "never" | "multiple"
# color-modes = false  # default
# text-width = 80  # default
# workspace-lsp-roots = []  # default; intended for project-specific .helix/config.toml
# default-line-ending = "native"  # default; native | lf | crlf | ff | cr | nel
# insert-final-newline = true  # default
# atomic-save = true  # default
# trim-final-newlines = false  # default
# trim-trailing-whitespace = false  # default
# popup-border = "none"  # default; popup | menu | all | none
# indent-heuristic = "hybrid"  # default; hybrid | tree-sitter | simple
# jump-label-alphabet = "abcdefghijklmnopqrstuvwxyz"  # default
# end-of-line-diagnostics = "hint"  # default; error | warning | info | hint | disable
# clipboard-provider = "wayland"  # example; actual default is platform/environment specific
# editor-config = true  # default
# rainbow-brackets = false  # default; requires language rainbows.scm queries
# kitty-keyboard-protocol = "auto"  # default; enabled | disabled | auto
# auto-pairs = true  # default; alternatively configure [editor.auto-pairs] below

# -----------------------------------------------------------------------------
# Clipboard provider — custom commands
# -----------------------------------------------------------------------------
# [editor.clipboard-provider.custom]
# yank = { command = "cat", args = ["test.txt"] }  # example from source
# paste = { command = "tee", args = ["test.txt"] }  # example from source
# primary-yank = { command = "cat", args = ["test-primary.txt"] }  # optional example
# primary-paste = { command = "tee", args = ["test-primary.txt"] }  # optional example

# -----------------------------------------------------------------------------
# Statusline
# -----------------------------------------------------------------------------
# [editor.statusline]
# left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]  # default
# center = []  # default
# right = ["diagnostics", "selections", "register", "position", "file-encoding"]  # default
# separator = "│"  # default
# mode.normal = "NOR"  # default
# mode.insert = "INS"  # default
# mode.select = "SEL"  # default
# diagnostics = ["warning", "error"]  # default
# workspace-diagnostics = ["warning", "error"]  # default
# Available statusline elements:
# mode, spinner, file-name, file-absolute-path, file-base-name,
# current-working-directory, file-modification-indicator, file-encoding,
# file-line-ending, file-indent-style, read-only-indicator, total-line-numbers,
# file-type, diagnostics, workspace-diagnostics, selections,
# primary-selection-length, position, position-percentage, separator, spacer,
# version-control, register, code-action-hint

# -----------------------------------------------------------------------------
# LSP
# -----------------------------------------------------------------------------
# [editor.lsp]
# enable = true  # default
# display-messages = true  # default
# display-progress-messages = false  # default
# auto-signature-help = true  # default
# auto-document-highlight = false  # default
# display-inlay-hints = false  # default
# inlay-hints-length-limit = 80  # example; unset by default
# display-color-swatches = true  # default
# display-signature-help-docs = true  # default
# snippets = true  # default; requires LSP restart after changing
# goto-reference-include-declaration = true  # default

# -----------------------------------------------------------------------------
# Cursor shape
# -----------------------------------------------------------------------------
# [editor.cursor-shape]
# normal = "block"  # default; block | bar | underline | hidden
# insert = "block"  # default; block | bar | underline | hidden
# select = "block"  # default; block | bar | underline | hidden

# -----------------------------------------------------------------------------
# File picker
# -----------------------------------------------------------------------------
# [editor.file-picker]
# hidden = true  # default
# follow-symlinks = true  # default
# deduplicate-links = true  # default
# parents = true  # default
# ignore = true  # default
# git-ignore = true  # default
# git-global = true  # default
# git-exclude = true  # default
# max-depth = 10  # example; unset by default

# -----------------------------------------------------------------------------
# File explorer
# -----------------------------------------------------------------------------
# [editor.file-explorer]
# hidden = false  # default
# follow-symlinks = false  # default
# parents = false  # default
# ignore = false  # default
# git-ignore = false  # default
# git-global = false  # default
# git-exclude = false  # default
# flatten-dirs = true  # default

# -----------------------------------------------------------------------------
# Buffer picker
# -----------------------------------------------------------------------------
# [editor.buffer-picker]
# start-position = "current"  # default; source example uses "previous"

# -----------------------------------------------------------------------------
# Auto pairs — explicit pair map
# -----------------------------------------------------------------------------
# [editor.auto-pairs]
# '(' = ')'
# '{' = '}'
# '[' = ']'
# '"' = '"'
# '`' = '`'
# '<' = '>'  # optional example from source, not part of documented default set

# -----------------------------------------------------------------------------
# Auto save
# -----------------------------------------------------------------------------
# [editor.auto-save]
# focus-lost = false  # default
# after-delay.enable = false  # default
# after-delay.timeout = 3000  # default ms

# -----------------------------------------------------------------------------
# Search
# -----------------------------------------------------------------------------
# [editor.search]
# smart-case = true  # default
# wrap-around = true  # default

# -----------------------------------------------------------------------------
# Whitespace
# -----------------------------------------------------------------------------
# [editor.whitespace]
# render = "none"  # default; may also be "all" or a per-character table
# characters are configured in the subtable below

# Per-character render policy:
# [editor.whitespace.render]
# space = "all"  # example from source
# tab = "all"  # example from source
# nbsp = "none"  # example from source
# nnbsp = "none"  # example from source
# newline = "none"  # example from source

# Visible glyphs:
# [editor.whitespace.characters]
# space = "·"  # example from source
# nbsp = "⍽"  # example from source
# nnbsp = "␣"  # example from source
# tab = "→"  # example from source
# newline = "⏎"  # example from source
# tabpad = "·"  # example from source

# -----------------------------------------------------------------------------
# Indent guides
# -----------------------------------------------------------------------------
# [editor.indent-guides]
# render = false  # default
# character = "│"  # default
# skip-levels = 0  # default

# -----------------------------------------------------------------------------
# Gutters
# -----------------------------------------------------------------------------
# [editor.gutters]
# layout = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]  # default

# Line-number gutter:
# [editor.gutters.line-numbers]
# min-width = 3  # default
# [editor.gutters.diagnostics]          # currently no options
# [editor.gutters.diff]                 # currently no options
# [editor.gutters.spacer]               # currently no options
# [editor.gutters.code-action-hint]     # currently no options

# -----------------------------------------------------------------------------
# Soft wrap
# -----------------------------------------------------------------------------
# [editor.soft-wrap]
# enable = false  # default
# max-wrap = 20  # default
# max-indent-retain = 40  # default
# wrap-indicator = "↪ "  # default
# wrap-at-text-width = false  # default

# -----------------------------------------------------------------------------
# Smart tab
# -----------------------------------------------------------------------------
# [editor.smart-tab]
# enable = true  # default
# supersede-menu = false  # default

# -----------------------------------------------------------------------------
# Inline diagnostics
# -----------------------------------------------------------------------------
# [editor.inline-diagnostics]
# cursor-line = "warning"  # default
# other-lines = "disable"  # default
# prefix-len = 1  # default
# max-wrap = 20  # default
# max-diagnostics = 10  # default
# cursor-line / other-lines: error | warning | info | hint | disable

# -----------------------------------------------------------------------------
# Word completion
# -----------------------------------------------------------------------------
# [editor.word-completion]
# enable = true  # default
# trigger-length = 7  # default

# -----------------------------------------------------------------------------
# Workspace trust
# -----------------------------------------------------------------------------
# [editor.workspace-trust]
# level = "servers"  # default; none | servers | insecure
# prompt = true  # default
# trusted = []  # default; source discourages broad trust globs

