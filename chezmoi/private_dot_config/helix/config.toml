# "y" = "yank_to_clipboard"  # Yank selections to clipboard
# "Y" = "yank_main_selection_to_clipboard"  # Yank main selection to clipboard
# "R" = "replace_selections_with_clipboard"  # Replace selections by clipboard contents
# "/" = "global_search"  # Global search in workspace folder
# "?" = "command_palette"  # Open command palette

# -----------------------------------------------------------------------------
# Keymaps — unimpaired prefix ]
# -----------------------------------------------------------------------------
# [keys.normal."]"]
# "d" = "goto_next_diag"  # Go to next diagnostic ()
# "D" = "goto_last_diag"  # Go to last diagnostic in document ()
# "f" = "goto_next_function"  # Go to next function ()
# "t" = "goto_next_class"  # Go to next type definition ()
# "a" = "goto_next_parameter"  # Go to next argument/parameter ()
# "c" = "goto_next_comment"  # Go to next comment ()
# "e" = "goto_next_entry"  # Go to next entry ()
# "T" = "goto_next_test"  # Go to next test ()
# "p" = "goto_next_paragraph"  # Go to next paragraph
# "g" = "goto_next_change"  # Go to next change
# "G" = "goto_last_change"  # Go to last change
# "x" = "goto_prev_xml_element"  # Go to previous (X)HTML element
# "space" = "add_newline_below"  # Add newline below

# -----------------------------------------------------------------------------
# Keymaps — unimpaired prefix [
# -----------------------------------------------------------------------------
# [keys.normal."["]
# "d" = "goto_prev_diag"  # Go to previous diagnostic ()
# "D" = "goto_first_diag"  # Go to first diagnostic in document ()
# "f" = "goto_prev_function"  # Go to previous function ()
# "t" = "goto_prev_class"  # Go to previous type definition ()
# "a" = "goto_prev_parameter"  # Go to previous argument/parameter ()
# "c" = "goto_prev_comment"  # Go to previous comment ()
# "e" = "goto_prev_entry"  # Go to previous entry ()
# "T" = "goto_prev_test"  # Go to previous test ()
# "p" = "goto_prev_paragraph"  # Go to previous paragraph
# "g" = "goto_prev_change"  # Go to previous change
# "G" = "goto_first_change"  # Go to first change
# "x" = "goto_next_xml_element"  # Go to next (X)HTML element
# "space" = "add_newline_above"  # Add newline above

# -----------------------------------------------------------------------------
# Keymaps — insert mode
# -----------------------------------------------------------------------------
# [keys.insert]
# "esc" = "normal_mode"  # Switch to normal mode
# "C-s" = "commit_undo_checkpoint"  # Commit undo checkpoint
# "C-x" = "completion"  # Autocomplete
# "C-r" = "insert_register"  # Insert a register content
# "C-w" = "delete_word_backward"  # Delete previous word
# "A-backspace" = "delete_word_backward"  # Delete previous word
# "A-d" = "delete_word_forward"  # Delete next word
# "A-del" = "delete_word_forward"  # Delete next word
# "C-u" = "kill_to_line_start"  # Delete to start of line
# "C-k" = "kill_to_line_end"  # Delete to end of line
# "C-h" = "delete_char_backward"  # Delete previous char
# "backspace" = "delete_char_backward"  # Delete previous char
# "S-backspace" = "delete_char_backward"  # Delete previous char
# "C-d" = "delete_char_forward"  # Delete next char
# "del" = "delete_char_forward"  # Delete next char
# "C-j" = "insert_newline"  # Insert new line
# "ret" = "insert_newline"  # Insert new line
# "tab" = "smart_tab"  # [Smart tab] (configurable)
# "S-tab" = "insert_tab"  # Insert tab
# "up" = "move_line_up"  # Move to previous line
# "down" = "move_line_down"  # Move to next line
# "left" = "move_char_left"  # Backward a char
# "right" = "move_char_right"  # Forward a char
# "pageup" = "page_up"  # Move one page up
# "pagedown" = "page_down"  # Move one page down
# "home" = "goto_line_start"  # Move to line start
# "end" = "goto_line_end_newline"  # Move to line end

# -----------------------------------------------------------------------------
# Keymaps — select mode
# -----------------------------------------------------------------------------
# keymap.md states that select/extend mode echoes normal mode but transforms
# movements/gotos into extending selections; it does not enumerate a separate
# complete command table, so no synthetic defaults are invented here.
# The following smart-tab bindings are explicitly documented in editor.md:
# [keys.select]
# tab = "extend_parent_node_end"  # optional smart-tab example
# S-tab = "extend_parent_node_start"  # optional smart-tab example

