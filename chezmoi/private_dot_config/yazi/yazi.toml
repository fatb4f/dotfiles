[mgr]
ratio = [0, 2, 6]

[opener]
edit = [{ run = 'nvim "$@"', block = true, for = "unix" }]
open = [{ run = 'xdg-open "$1"', orphan = true, desc = "Open", for = "linux" }]
extract = [{ run = "ya pub extract --list %s", desc = "Extract here" }]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
]

[plugin]
prepend_previewers = [
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch" },
  { url = "**/.git/", run = "preview-git" },
  { url = "*.json", run = 'piper -- jq -C . "$1"' },
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w "$(tput cols)" -s=dark "$1"' },
  { url = "*.tar*", run = 'piper --format=url -- tar tf "$1"' },
  { url = "*.cue", run = 'piper -- bat --color=always --style=numbers "$1"' },
  { url = "*.service", run = 'piper -- bat --color=always --style=numbers "$1"' },
]
