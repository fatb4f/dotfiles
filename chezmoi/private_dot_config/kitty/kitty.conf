# Root Kitty config.
# Contract:
# - This file is the stable/base config.
# - Host/local policy and key bindings live in kitty.conf.overrides.
# - Do not globinclude fragments here; keep the active graph two-file and explicit.

# UI
window_padding_width 2
window_margin_width 5
single_window_margin_width 0
window_border_width 1pt
hide_window_decorations yes
draw_minimal_borders yes
confirm_os_window_close 0
os_window_state maximized

# Visual affordances
background_opacity 0.95
inactive_text_alpha 0.7
dim_opacity 0.90
background_blur 1

# Layout defaults
enabled_layouts splits,stack,tall
remember_window_size yes
initial_window_width 1200
initial_window_height 800
close_on_child_death yes

# URL handling
url_style curly
open_url_with default
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes
allow_hyperlinks yes

# Typography
font_family JetBrainsMono Nerd Font
font_size 11.5
bold_font auto
italic_font auto
disable_ligatures never
symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 Symbols Nerd Font

cursor_shape beam
cursor_blink_interval 0

# Theme
# Tinty writes the live theme here. Use globinclude so Kitty remains launchable
# before the generated theme exists.
globinclude current-theme.conf

# Tabs
tab_bar_edge top
tab_bar_margin_width 1.0
tab_bar_margin_height 1.0 0.5
tab_bar_min_tabs 1
tab_bar_filter session:~ or session:^$
tab_bar_style custom
tab_powerline_style angled
tab_fade 0.25 0.5 0.75 1
active_tab_font_style bold-italic
inactive_tab_font_style normal
tab_title_template "{custom}"
active_tab_title_template "{custom}"
window_title_template "{custom}"
active_window_title_template "{custom}"

# Runtime
shell /usr/bin/env zsh -l
shell_integration enabled no-cursor no-title
allow_remote_control socket-only
listen_on unix:/tmp/kitty
window_drag_tolerance -200


# Local policy, host quirks, and normalized bindings.
include kitty.conf.overrides
