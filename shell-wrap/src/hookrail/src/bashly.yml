name: hookrail
help: CUE-first Codex hook adapter
version: 0.1.0

commands:
  - name: hook
    help: Read a Codex hook JSON object from stdin and emit native hook JSON
    filename: commands/hook.sh
    examples:
      - hookrail hook < fixture.json

  - name: doctor
    help: Run Hookrail slice-1 validation checks
    filename: commands/doctor.sh
    examples:
      - hookrail doctor

  - name: registry
    help: Export registry responses from the CUE registry
    commands:
      - name: resolve
        help: Resolve a registry query to JSON
        filename: commands/registry_resolve.sh
        flags:
          - long: --path
            help: Registry path to resolve
            arg: path
            required: true
          - long: --objective
            help: Retrieval objective
            arg: objective
            required: true
          - long: --allow-generated
            short: -g
            help: Allow generated paths
          - long: --allow-legacy
            short: -l
            help: Allow legacy paths
        examples:
          - hookrail registry resolve --path chezmoi/private_dot_config/wezterm/wezterm.lua --objective inspect_config
