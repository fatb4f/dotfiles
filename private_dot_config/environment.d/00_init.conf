XDG_CACHE_HOME=${XDG_CACHE_HOME:-${HOME}/.cache}
XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-${HOME}/.config}
XDG_DATA_HOME=${XDG_DATA_HOME:-${HOME}/.local/share}
XDG_STATE_HOME=${XDG_STATE_HOME:-${HOME}/.local/state}

XDG_CONFIG_DIRS=${XDG_CONFIG_DIRS:-/etc/xdg}
XDG_DATA_DIRS=${XDG_DATA_DIRS:-/usr/local/share:/usr/share}

PIP_CACHE_DIR=${PIP_CACHE_DIR:-${XDG_CACHE_HOME}/pip}
PYTHONPYCACHEPREFIX=${PYTHONPYCACHEPREFIX:-${XDG_CACHE_HOME}/pycache}
RUFF_CACHE_DIR=${RUFF_CACHE_DIR:-${XDG_CACHE_HOME}/ruff}
UV_CACHE_DIR=${UV_CACHE_DIR:-${XDG_CACHE_HOME}/uv}

ZSH_CACHE_DIR=${ZSH_CACHE_DIR:-${XDG_CACHE_HOME}/zsh}

XDG_DATA_BIN=${XDG_DATA_BIN:-${HOME}/.local/bin}
TOOL_PATH_HOME=${TOOL_PATH_HOME:-${XDG_DATA_HOME}/path}

CARGO_HOME=${CARGO_HOME:-${XDG_DATA_HOME}/cargo}
RUSTUP_HOME=${RUSTUP_HOME:-${XDG_DATA_HOME}/rustup}
GOPATH=${GOPATH:-${XDG_DATA_HOME}/go}
