# managed by chezmoi

profile = "slim"

[features]
codex_hooks = false
shell_tool = true
shell_snapshot = true

[profiles.slim]
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "cached"
allow_login_shell = false

[profiles.slim.shell_environment_policy]
inherit = "core"
include_only = [
  "HOME",
  "PATH",
  "SHELL",
  "TERM",
  "USER",
  "LOGNAME",
  "PWD",
  "LANG",
  "LC_*",
  "XDG_CONFIG_HOME",
  "XDG_DATA_HOME",
  "XDG_STATE_HOME",
  "XDG_CACHE_HOME",
  "CODEX_HOME",
  "CODEX_STATE",
]
exclude = ["*TOKEN*", "*SECRET*", "*KEY*", "*PASSWORD*"]
experimental_use_profile = false
ignore_default_excludes = false
