# ~/.con# ~/.config/fuzzel/fuzzel.ini

[main]
# Identity / layer-shell behavior.
namespace=launcher
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes

# Typography.
font=monospace:size=11
dpi-aware=auto
use-bold=yes
line-height=18

# Prompt.
prompt="> "
placeholder=Launch...
hide-before-typing=no
match-counter=yes

# Icons.
icons-enabled=yes
# icon-theme=Papirus-Dark
image-size-ratio=1

# App matching.
# Keep app-only. Do not include PATH executables.
list-executables-in-path=no

# Match desktop metadata, not arbitrary shell commands.
fields=filename,name,generic,categories,keywords
match-mode=fzf
sort-result=yes

# Desktop-file actions: “new window”, “private window”, etc.
show-actions=yes

# Performance tuning.
delayed-filter-ms=150
delayed-filter-limit=10000
match-workers=0
render-workers=0

# Critical uwsm-app boundary.
launch-prefix=uwsm-app --

# Literal terminal command. No $TERMINAL expansion.
terminal=kitty -e {cmd}

# Geometry.
anchor=center
lines=15
width=38
tabs=4
horizontal-pad=36
vertical-pad=10
inner-pad=4

# Theme fragment generated by Noctalia.
include=~/.config/fuzzel/themes/noctalia

[border]
width=1
radius=10
selection-radius=6

[key-bindings]
# Hard app-launcher boundary: never execute raw typed input.
execute-input=none

# Vim-ish movement.
prev=Up Control+p Control+k
next=Down Control+n Control+j
first=Control+g
last=Control+Shift+g

# Editing.
delete-line-backward=Control+u
delete-line-forward=Control+Shift+k
delete-prev-word=Control+w Control+BackSpace
clipboard-paste=Control+v

# Cache hygiene: remove bad/stale selected entry from frecency cache.
expunge=Shift+Delete

# Normal execute/cancel.
execute=Return KP_Enter
cancel=Escape Control+c Control+bracketleft
