# ~/.config/hypr/hypridle.conf

general {
    # D-Bus/logind Lock event -> actual locker service.
    lock_cmd = systemctl --user start session-lock.service

    # Optional symmetry. Keep empty unless you intentionally support external unlock events.
    # unlock_cmd =

    # Lock before suspend.
    before_sleep_cmd = loginctl lock-session

    # Avoid needing two keypresses after display sleep.
    after_sleep_cmd = hyprctl dispatch dpms on

    # Runtime-only abandoned locked-session power boundary.
    on_lock_cmd = systemctl --user start locked-session-halt.timer
    on_unlock_cmd = sh -c 'systemctl --user stop locked-session-halt.timer; loginctl unlock-session || true'

    # Prefer lock-complete-before-sleep semantics.
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
