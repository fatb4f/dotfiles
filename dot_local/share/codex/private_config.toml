# managed by chezmoi

profile = "slim"

log_dir = "/home/_404/.local/state/codex/log"
sqlite_home = "/home/_404/.local/state/codex/sqlite"
allow_login_shell = false

[features]
codex_hooks = false
shell_tool = true
shell_snapshot = false

[history]
persistence = "save-all"
max_bytes = 10485760

[profiles.slim]
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "cached"
model_reasoning_summary = "auto"

[shell_environment_policy]
inherit = "core"
include_only = [
  "HOME",
  "PATH",
  "SHELL",
  "TERM",
  "USER",
  "LOGNAME",
  "PWD",
  "LANG",
  "LC_*",

  "XDG_CONFIG_HOME",
  "XDG_DATA_HOME",
  "XDG_STATE_HOME",
  "XDG_CACHE_HOME",

  "CODEX_HOME",
  "CODEX_STATE",
  "CODEX_CACHE",
  "CODEX_SQLITE_HOME",

  #"TOOL_PATH_HOME",
  #"XDG_DATA_BIN",
  #"DOTS_HOME",
  #"DOTS_PROFILE",
  #"DOTS_AGENT_SURFACE",
]
exclude = ["*TOKEN*", "*SECRET*", "*KEY*", "*PASSWORD*"]
experimental_use_profile = false
ignore_default_excludes = false

[projects."/home/_404/.codex"]
trust_level = "trusted"

[tui]
status_line = ["model-with-reasoning", "current-dir", "model", "context-used", "five-hour-limit", "weekly-limit", "context-window-size", "used-tokens", "total-input-tokens", "total-output-tokens"]

[tui.model_availability_nux]
"gpt-5.5" = 1
