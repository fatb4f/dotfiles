name: CUE

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cue-lang/setup-cue@v1.0.0
        with:
          version: v0.16.1

      - name: Validate workspace model and Codex workflow contract
        run: cue cmd ci .codex/workflow.cue
