name: CUE

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cue-lang/setup-cue@v1.0.0
        with:
          version: v0.16.1

      - name: Validate dotfiles issue manifests
        run: |
          set -euo pipefail

          cd .github

          root="dotfiles-manifest-slice/contracts/issues"
          if [ ! -d "$root" ]; then
            echo "No dotfiles issue manifests found."
            exit 0
          fi

          find "$root" -name 'manifest.cue' -exec dirname {} \; \
            | sort -u \
            | while read -r dir; do
                echo "Validating $dir"
                cue vet "./$dir"
                cue export "./$dir" -e normalizedDotfilesIssueManifest >/dev/null
                cue export "./$dir" -e dotfilesValidationPlan >/dev/null
                cue export "./$dir" -e dotfilesCompletionReportContract >/dev/null
              done
