name: Apply selector rewrite

on:
  push:
    branches:
      - agent/context-selection-cutover-blockers

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified selector patch
        shell: bash
        run: |
          set -euo pipefail
          source_file=.codex/context-model/context_selection_service.cue
          patch_file=.selector-rewrite.patch
          expected_before=09f11cd5fb32758b33c139246d0eacec2af76d3506e0b3afce8f3c188dfb0c99
          expected_after=cda0d49b53d02a001faf73c9c7c3ac5f233b8d4caa8981b5339d6df516c2443c
          test "$(sha256sum "$source_file" | awk '{print $1}')" = "$expected_before"
          git apply --check "$patch_file"
          git apply "$patch_file"
          test "$(sha256sum "$source_file" | awk '{print $1}')" = "$expected_after"
          rm -f "$patch_file" .github/workflows/apply-selector-rewrite.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$source_file" "$patch_file" .github/workflows/apply-selector-rewrite.yml
          git commit -m "fix selector application lexical bindings"
          git push origin HEAD:agent/context-selection-cutover-blockers
