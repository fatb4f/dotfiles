name: CUE contracts

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-selector-repair:
    if: github.head_ref == 'agent/context-selection-cutover-qualification'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply staged selector subtype repair
        shell: bash
        run: |
          set -euo pipefail
          patch_file=.selector-subtype-aliases.patch
          git apply --check "$patch_file"
          git apply "$patch_file"
          rm -f "$patch_file" .github/workflows/apply-selector-subtype-aliases.yml
          git show HEAD^:.github/workflows/cue-contracts.yml > .github/workflows/cue-contracts.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix selector subtype projection bindings"
          git push origin HEAD:agent/context-selection-cutover-qualification
