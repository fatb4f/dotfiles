name: CUE contracts

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-selector-repair:
    if: github.head_ref == 'agent/context-selection-cutover-qualification'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic selector subtype repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.codex/context-model/context_selection_service.cue')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '\tCommittedProjection=committedProjection: #GitCommittedSnapshotProjection': '\tcommittedProjection: #GitCommittedSnapshotProjection',
              '\tCommittedEffectivePathEvaluation=effectivePathEvaluation: #GitCommittedEffectivePathEvaluation & {': '\teffectivePathEvaluation: #GitCommittedEffectivePathEvaluation & {',
              'CommittedProjection.graph.snapshotID': 'committedProjection.graph.snapshotID',
              'CommittedProjection.observation.occurrences': 'committedProjection.observation.occurrences',
              'CommittedProjection.observation.repositoryID': 'committedProjection.observation.repositoryID',
              'CommittedProjection.collected.state.evidenceID': 'committedProjection.collected.state.evidenceID',
              '\tsnapshot:      CommittedProjection.graph': '\tsnapshot:      committedProjection.graph',
              '\teffectiveView: CommittedEffectivePathEvaluation.view': '\teffectiveView: effectivePathEvaluation.view',
              '\tOverlayProjection=overlayProjection:     #GitOverlayProjection': '\toverlayProjection:   #GitOverlayProjection',
              '\t_committedBinding:                       OverlayProjection.committed.observationDigest & CommittedProjection.observationDigest': '\t_committedBinding:   overlayProjection.committed.observationDigest & committedProjection.observationDigest',
              '\tOverlayEffectivePathEvaluation=effectivePathEvaluation: #GitEffectivePathEvaluation & {': '\teffectivePathEvaluation: #GitEffectivePathEvaluation & {',
              'OverlayProjection.graph.snapshotID': 'overlayProjection.graph.snapshotID',
              'OverlayProjection.observation.index.occurrences': 'overlayProjection.observation.index.occurrences',
              'OverlayProjection.observation.worktree.occurrences': 'overlayProjection.observation.worktree.occurrences',
              'OverlayProjection.observation.repositoryID': 'overlayProjection.observation.repositoryID',
              'OverlayProjection.observation.baseRevision.format': 'overlayProjection.observation.baseRevision.format',
              'OverlayProjection.observation.baseRevision.hex': 'overlayProjection.observation.baseRevision.hex',
              'OverlayProjection.collected.index.state.evidenceID': 'overlayProjection.collected.index.state.evidenceID',
              'OverlayProjection.collected.worktree.state.evidenceID': 'overlayProjection.collected.worktree.state.evidenceID',
              '\tsnapshot:      OverlayProjection.graph': '\tsnapshot:      overlayProjection.graph',
              '\teffectiveView: OverlayEffectivePathEvaluation.view': '\teffectiveView: effectivePathEvaluation.view',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, found {count}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .selector-subtype-aliases.patch .github/workflows/apply-selector-subtype-aliases.yml
          git show origin/main:.github/workflows/cue-contracts.yml > .github/workflows/cue-contracts.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix selector subtype projection bindings"
          git push origin HEAD:agent/context-selection-cutover-qualification
