name: CUE contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cue-contracts:
    runs-on: ubuntu-latest

    env:
      CUE_VERSION: v0.17.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install CUE
        run: |
          go install cuelang.org/go/cmd/cue@${CUE_VERSION}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install matrix tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Print tool versions
        run: |
          cue version
          jq --version

      - name: Run CUE contract validation
        run: |
          bash .github/scripts/cue-contract-test.sh
