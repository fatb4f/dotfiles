name: CUE contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cue-contracts:
    runs-on: ubuntu-latest

    env:
      CUE_REVISION: 806821e40fae070318600a264d311517e596353b
      PYTHON_VERSION: "3.14"
      UV_VERSION: "0.10.0"
      HYPOTHESIS_VERSION: "6.158.0"
      PYTEST_VERSION: "9.1.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply staged selector subtype repair
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/context-selection-cutover-qualification'
        shell: bash
        run: |
          set -euo pipefail
          patch_file=.selector-subtype-aliases.patch
          if [[ -f "$patch_file" ]]; then
            git apply --check "$patch_file"
            git apply "$patch_file"
            rm -f "$patch_file" .github/workflows/apply-selector-subtype-aliases.yml
            git show HEAD^:.github/workflows/cue-contracts.yml > .github/workflows/cue-contracts.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "fix selector subtype projection bindings"
            git push origin HEAD:agent/context-selection-cutover-qualification
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CUE
        run: |
          go install cuelang.org/go/cmd/cue@${CUE_REVISION}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install matrix and workbook tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python -m pip install "uv==${UV_VERSION}"
          uv sync

      - name: Print tool versions
        run: |
          cue version
          jq --version
          python --version
          uv --version

      - name: Run CUE contract validation
        run: bash .github/scripts/cue-contract-test.sh

      - name: Run Codex profile contract validation
        run: bash .github/scripts/codex-profile-test.sh

      - name: Run normalized context graph validation
        run: bash .github/scripts/context-graph-test.sh

      - name: Run context graph authority validation
        run: |
          uv run --project . \
            --with "hypothesis==${HYPOTHESIS_VERSION}" \
            --with "pytest==${PYTEST_VERSION}" \
            -- bash .github/scripts/context-graph-authority-test.sh

      - name: Run context graph admission validation
        run: |
          uv run --project . \
            --with "hypothesis==${HYPOTHESIS_VERSION}" \
            --with "pytest==${PYTEST_VERSION}" \
            -- bash .github/scripts/context-graph-admission-test.sh

      - name: Run context graph property validation
        run: |
          uv run --project . \
            --with "hypothesis==${HYPOTHESIS_VERSION}" \
            --with "pytest==${PYTEST_VERSION}" \
            -- bash .github/scripts/context-graph-property-test.sh

      - name: Run context workbook DSPy validation
        run: |
          uv run --project . \
            --with "hypothesis==${HYPOTHESIS_VERSION}" \
            --with "pytest==${PYTEST_VERSION}" \
            -- bash .github/scripts/context-workbook-test.sh dspy

      - name: Compile context workbook
        run: |
          uv run --project . \
            --with "hypothesis==${HYPOTHESIS_VERSION}" \
            --with "pytest==${PYTEST_VERSION}" \
            -- python -m compileall -q .codex/context-workbook

      - name: Run context workbook CLI tests
        run: |
          cd .codex/context-workbook/tests
          PYTHONPATH=../src uv run --project "$GITHUB_WORKSPACE" -- python -m unittest -v test_cli

      - name: Run context workbook model tests
        run: |
          cd .codex/context-workbook/tests
          PYTHONPATH=../src uv run --project "$GITHUB_WORKSPACE" -- python -m unittest -v test_models

      - name: Run context workbook DSPy program tests
        run: |
          cd .codex/context-workbook/tests
          PYTHONPATH=../src uv run --project "$GITHUB_WORKSPACE" -- python -m unittest -v test_dspy_program

      - name: Run context workbook engine tests A
        run: |
          cd .codex/context-workbook/tests
          PYTHONPATH=../src uv run --project "$GITHUB_WORKSPACE" -- python -m unittest -v \
            test_engine.EngineTests.test_establishes_cue_valid_context_and_packet \
            test_engine.EngineTests.test_requested_projection_ids_gate_projection_creation \
            test_engine.EngineTests.test_request_boundary_scopes_all_reasoner_inputs \
            test_engine.EngineTests.test_request_boundary_retains_fragment_prerequisite_closure \
            test_engine.EngineTests.test_fragment_selection_requires_prerequisite_closure \
            test_engine.EngineTests.test_cue_state_requires_fragment_prerequisite_closure \
            test_engine.EngineTests.test_request_boundary_filters_workflow_entries_and_provider_routes \
            test_engine.EngineTests.test_prompt_change_invalidates_dependent_nodes_only

      - name: Run context workbook engine tests B1
        run: |
          cd .codex/context-workbook/tests
          PYTHONPATH=../src uv run --project "$GITHUB_WORKSPACE" -- python -m unittest -v \
            test_engine.EngineTests.test_unknown_provider_fails_closed \
            test_engine.EngineTests.test_outside_file_fails_closed \
            test_engine.EngineTests.test_request_file_cannot_widen_configured_paths \
            test_engine.EngineTests.test_requested_revision_controls_inventory_materialization

      - name: Run context workbook engine snapshot tests
        run: |
          cd .codex/context-workbook/tests
          PYTHONPATH=../src uv run --project "$GITHUB_WORKSPACE" -- python -m unittest -v \
            test_engine.EngineTests.test_resolved_revision_keeps_config_and_state_on_same_snapshot \
            test_engine.EngineTests.test_repository_observation_records_resolved_commit

      - name: Run default reasoner engine test
        run: |
          cd .codex/context-workbook/tests
          PYTHONPATH=../src uv run --project "$GITHUB_WORKSPACE" -- python -m unittest -v \
            test_engine.EngineTests.test_missing_model_uses_chatgpt_authenticated_codex_default

      - name: Run unavailable-runtime engine test
        if: always()
        run: |
          cd .codex/context-workbook/tests
          PYTHONPATH=../src uv run --project "$GITHUB_WORKSPACE" -- python -m unittest -v \
            test_engine.EngineTests.test_runtime_auth_failure_uses_shared_fail_closed_decision

      - name: Run gap-dominance engine test
        if: always()
        run: |
          cd .codex/context-workbook/tests
          PYTHONPATH=../src uv run --project "$GITHUB_WORKSPACE" -- python -m unittest -v \
            test_engine.EngineTests.test_complete_gap_map_overrides_sufficiency_claim

      - name: Run direct CUE vet qualification
        run: |
          cd .codex/context-model
          cue vet -c=false .

      - name: Run direct pytest qualification
        env:
          CONTEXT_GIT_ASSERTION_CANDIDATE_DIR: ${{ runner.temp }}/context-git-assertion-candidates
        run: |
          set -o pipefail
          PYTHONPATH=.codex/context-workbook/src uv run --project . \
            --with "hypothesis==${HYPOTHESIS_VERSION}" \
            --with "pytest==${PYTEST_VERSION}" \
            -- pytest .codex/context-workbook/tests 2>&1 | tee "$RUNNER_TEMP/context-workbook-pytest.log"

      - name: Upload direct pytest qualification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-workbook-pytest
          path: ${{ runner.temp }}/context-workbook-pytest.log
          if-no-files-found: error

      - name: Upload Git snapshot assertion candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-git-assertion-candidates
          path: ${{ runner.temp }}/context-git-assertion-candidates
          if-no-files-found: ignore

      - name: Check deterministic plugin projections
        run: |
          uv run --project . -- \
            python -m context_workbook.projections --repo-root "$GITHUB_WORKSPACE" --check

      - name: Prove legacy lexical routing is absent
        run: |
          if grep -E 'ascii_downcase|promptRoutes|contains\(\$term\)' \
            .codex/plugins/agent-context-resolver/scripts/agent-context-resolver-hook \
            .codex/plugins/agent-context-resolver/scripts/resolve-agent-context; then
            echo "FAIL: legacy lexical routing remains in resolver adapters" >&2
            exit 1
          fi

      - name: Run context workbook hook validation
        run: |
          uv run --project . \
            --with "hypothesis==${HYPOTHESIS_VERSION}" \
            --with "pytest==${PYTEST_VERSION}" \
            -- bash .github/scripts/context-workbook-test.sh hook

  git-committed-snapshot:
    runs-on: ubuntu-latest

    env:
      CUE_REVISION: 806821e40fae070318600a264d311517e596353b
      GO_VERSION: "1.26.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install pinned CUE and jq
        run: |
          go install cuelang.org/go/cmd/cue@${CUE_REVISION}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Print hydrator tool versions
        run: |
          go version
          cue version
          jq --version

      - name: Run committed Git snapshot hydrator qualification
        env:
          CONTEXT_GIT_QUALIFICATION_DIR: ${{ runner.temp }}/context-git-hydrator-qualification
        run: |
          set -o pipefail
          bash .github/scripts/context-git-hydrator-test.sh 2>&1 | tee "$RUNNER_TEMP/context-git-hydrator-qualification.log"

      - name: Upload committed snapshot qualification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-git-hydrator-qualification
          path: ${{ runner.temp }}/context-git-hydrator-qualification.log
          if-no-files-found: error

      - name: Upload committed snapshot qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-git-hydrator-reports
          path: ${{ runner.temp }}/context-git-hydrator-qualification
          if-no-files-found: error

      - name: Run Git index and worktree overlay qualification
        env:
          CONTEXT_GIT_OVERLAY_QUALIFICATION_DIR: ${{ runner.temp }}/context-git-overlay-qualification
        run: |
          set -o pipefail
          bash .github/scripts/context-git-overlay-test.sh 2>&1 | tee "$RUNNER_TEMP/context-git-overlay-qualification.log"

      - name: Upload Git overlay qualification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-git-overlay-qualification
          path: ${{ runner.temp }}/context-git-overlay-qualification.log
          if-no-files-found: error

      - name: Upload Git overlay qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-git-overlay-reports
          path: ${{ runner.temp }}/context-git-overlay-qualification
          if-no-files-found: error
