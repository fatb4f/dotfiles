name: Apply selector alias cleanup

on:
  push:
    branches:
      - agent/context-selection-cutover-qualification

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified selector alias patch
        shell: bash
        run: |
          set -euo pipefail
          source_file=.codex/context-model/context_selection_service.cue
          patch_file=.selector-unused-aliases.patch
          expected_before=cda0d49b53d02a001faf73c9c7c3ac5f233b8d4caa8981b5339d6df516c2443c
          expected_after=83eb73018972fb6240c988bd061e856224d601018ca71fc9f6b367c6e2c5cbdb
          test "$(sha256sum "$source_file" | awk '{print $1}')" = "$expected_before"
          git apply --check "$patch_file"
          git apply "$patch_file"
          test "$(sha256sum "$source_file" | awk '{print $1}')" = "$expected_after"
          rm -f "$patch_file" .github/workflows/apply-selector-alias-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$source_file" "$patch_file" .github/workflows/apply-selector-alias-cleanup.yml
          git commit -m "remove unused selector aliases"
          git push origin HEAD:agent/context-selection-cutover-qualification
