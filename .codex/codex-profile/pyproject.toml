[project]
name = "codex-profile"
version = "0.1.0"
description = "Read-only Codex rollout profiling and DuckDB ingestion"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4.0",
]

[project.scripts]
codex-profile = "codex_profile.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true
