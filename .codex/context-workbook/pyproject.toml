[project]
name = "dotfiles-context-workbook"
version = "0.1.0"
description = "CUE-rooted Marimo/DSPy context establishment for dotfiles Codex plugins"
requires-python = ">=3.14,<3.15"
dependencies = [
  "dspy==3.2.1",
  "marimo==0.23.14",
  "pydantic==2.13.4",
]

[project.scripts]
dotfiles-context-workbook = "context_workbook.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_workbook"]
